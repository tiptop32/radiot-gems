name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push to a PR supersedes the older run, while
# main-branch runs finish in order.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eval
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:pages
      - name: Verify Pages artifact before upload
        run: npm run test:pages
      - run: npm run eval:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client/radiot-gems

  deploy:
    # Deploy only for main-branch pushes and manual runs; PRs are validation-only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # Only deployments share the Pages group, so PR runs can never cancel a
    # queued deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
